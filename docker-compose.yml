services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password

  web:
    build: .
    # CAMBIO 1: Gunicorn en lugar de runserver ('Tienda' es la carpeta del wsgi.py)
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_libros && gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    restart: on-failure
    environment:
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db
      - DB_PORT=5432
    # NOTA: ya no hay seccion 'ports'. Django esta aislado detras de Nginx.

  # CAMBIO 2: Nginx es el unico que da la cara a internet
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:
