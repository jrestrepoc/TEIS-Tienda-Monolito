# nginx/nginx.conf  (Tutorial 06: Strangler Pattern)
# El log muestra a que backend (upstream) se envio cada peticion.
log_format strangler '$remote_addr [$time_local] "$request" $status -> $upstream_addr';
access_log /var/log/nginx/access.log strangler;

upstream django_v1 {
    server web_django:8000;
}

upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;

    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTA VIEJA: sigue yendo a Django
    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
    }

    # RUTA NUEVA: estrangulamos la funcion de compra y la mandamos a Flask
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
    }

    # Vistas HTML del monolito (inventario, compra web)
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
    }
}
