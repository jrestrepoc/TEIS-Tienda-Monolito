# nginx/nginx.conf  (Tutorial 05: Nginx como proxy inverso de Django + Gunicorn)

# 1. Backend: Django servido por Gunicorn.
#    'web' debe coincidir con el nombre del servicio en docker-compose.yml
upstream django_backend {
    server web:8000;
}

server {
    # Nginx escucha en el puerto web estandar (80)
    listen 80;

    location = /favicon.ico { access_log off; log_not_found off; }

    # 2. Proxy inverso: todo el trafico va al backend de Django
    location / {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Nota arquitectonica: en el Tutorial 06 se agrega 'location /api/v2/'
    # apuntando al microservicio Flask (Strangler Pattern).
}
